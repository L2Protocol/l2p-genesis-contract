[profile.default]
src = 'contracts'
test = 'test'
script = 'foundry-script'
out = 'out'
fs_permissions = [{ access = "read-write", path = "./out" }]
libs = ['lib', 'node_modules']
auto_detect_remappings = false
remappings = [
    'ds-test/=lib/forge-std/lib/ds-test/src/',
    'forge-std/=lib/forge-std/src/',
    '@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/',
    '@openzeppelin/contracts-v5/=node_modules/@openzeppelin/contracts-v5/',
    '@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/',
    '@ensdomains/buffer/=node_modules/@ensdomains/buffer/',
]
cache = true
cache_path = 'cache'
auto_detect_solc = true
# Pinned rather than inherited: solc <=0.8.19 defaulted to london and newer ones default to
# the newest EVM they know, so leaving this unset lets genesis bytecode change under us.
# cancun is the newest target that changes codegen; prague and osaka compile bit-identically,
# and cancun is the settled definition of the three. This assumes the chain has Cancun active
# on the first block it produces, which holds as long as the fork times are in the past when
# the network is started.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
verbosity = 3
ignored_error_codes = [1878, 5574]
ffi = true
initial_balance = '0xffffffffffffffffffffffff'
bytecode_hash = 'none'

# contracts/ens is vendored from ensdomains/ens-contracts; linting third-party
# sources produces >1MB of findings we will not act on, which also overflowed the
# execSync buffer in scripts/check-genesis-bytecode.ts.
[lint]
ignore = ["contracts/ens/**/*.sol"]

[profile.default.rpc_storage_caching]
chains = 'all'
endpoints = 'all'

[fuzz]
runs = 512

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = 'long'
func_attrs_with_params_multiline = true
quote_style = 'double'
number_underscore = 'preserve'
multiline_func_header = 'params_first'

[rpc_endpoints]
l2p = "${RPC_L2P}" # set by .env
local = "http://127.0.0.1:8545"
